name: Build & release VoxDub Studio (Windows)

# Build thật trên runner Windows của GitHub (autodub_gui chỉ hỗ trợ Windows,
# không cross-compile được từ Linux — xem scripts/build_exe.py).
# Chạy khi push tag "v*" (vd v2.1.0), hoặc kích hoạt tay từ tab Actions.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # cần để action tạo GitHub Release + upload asset

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Địa chỉ máy chủ phải nhúng vào exe TẠI ĐÂY. Runner của GitHub không
      # có `.env`, nên trước ngày 22/8/2026 mọi bản phát hành đều nhúng chuỗi
      # rỗng và chạy ngoại tuyến hoàn toàn — menu vẫn đủ, bấm vào thì không
      # có gì xảy ra và cũng không có câu lỗi nào. Đây không phải bí mật (là
      # địa chỉ công khai của máy chủ), nên để thẳng ở đây cho ai đọc cũng
      # thấy; có test đối chiếu trong `tests/test_build_exe_nhung_dia_chi.py`.
      - name: Build (PyInstaller onedir + lắp ráp + smoke test)
        env:
          VOXDUB_API_URL: https://voxdub-app.cmc-1.vibenode.matbao.ai
        run: python scripts/build_exe.py

      - name: Nén dist/VoxDub thành zip phân phối
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          Compress-Archive -Path dist/VoxDub/* -DestinationPath "VoxDub-Studio-$ver-win64.zip"

      # mini-spec C45 — CỔNG KIỂM TRƯỚC KHI PHÁT HÀNH.
      #
      # Trước đây CI đóng gói xong là phát hành thẳng: không ai chạy thử cái vừa
      # đóng gói. Điểm yếu số 1 của dự án (FEATURES §5.1) là không có máy Windows
      # nào kiểm thử, nên chuỗi V73–V87 và C29–C43 đều do người dùng cuối phát
      # hiện. Bước này chạy MỘT LƯỢT DUB THẬT trên chính runner Windows: đọc
      # video, nghe bằng Whisper với "tự nhận ngôn ngữ", rồi dừng ở bước dịch
      # tay (không gọi máy chủ, không tốn Vox). Hỏng thì KHÔNG phát hành.
      - name: Bảo đảm có ffmpeg cho lượt chạy thật
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1

      # mini-spec C55 — chặng 2 của cổng kiểm cần giọng đọc THẬT.
      #
      # Model ~300 MB tải từ HuggingFace; cache lại để lượt phát hành sau không
      # tải lại. Cache trượt thì bước dưới tự cài, chỉ chậm hơn chứ không sai.
      - name: Cache model VieNeu
        uses: actions/cache@v4
        with:
          path: |
            models/vieneu
            .venv-vieneu
          key: vieneu-${{ runner.os }}-${{ hashFiles('scripts/setup_vieneu.py') }}

      - name: Cài VieNeu (giọng đọc tiếng Việt)
        run: python scripts/setup_vieneu.py

      # mini-spec C45 + C55 — CỔNG KIỂM TRƯỚC KHI PHÁT HÀNH.
      #
      # C45 chạy tới bước dịch. C55 đi NỐT: đóng vai người dùng dịch tay, đọc
      # giọng bằng VieNeu, ghép video, rồi soi chính tệp ra — có luồng tiếng
      # không, có CÂM không, thời lượng có khớp không. Trước C55, hai thứ chính
      # LÀ sản phẩm (giọng đọc + video ghép) chưa từng được chạy thử trước khi
      # phát hành: bản có thể ship với video ra câm mà mọi mã thoát đều xanh.
      - name: Kiểm bằng MỘT LƯỢT CHẠY THẬT tới tận video ra (chặn phát hành nếu hỏng)
        id: dub-nguon
        env:
          WHISPER_MODEL: tiny   # kiểm ĐƯỜNG CHẠY, không chấm chất lượng nghe
        run: python scripts/kiem_chay_that.py --video tap01_clip.mp4 --timeout 2700 --den-cuoi

      # mini-spec I0-FDE — CỔNG KIỂM BẢN ĐÓNG GÓI (I0-D · I0-E · I0-F).
      #
      # Bước trên chứng minh ĐƯỜNG ỐNG còn nguyên, nhưng nó chạy `python -m
      # autodub.cli`, tức MÃ NGUỒN. Ba thứ nó không chạm tới, và cả ba đều đã
      # hỏng thật ít nhất một lần:
      #   * tệp worker thiếu khỏi gói (V80: `asr_whisper_worker.py` vắng mặt
      #     trong `datas` qua hàng chục bản phát hành, mọi cổng vẫn xanh);
      #   * bản cài mới trên máy trắng không cài nổi bộ máy;
      #   * nâng cấp cạnh bên mất `.venv-*`/`models/` (V77/V81/V96).
      # Ba bước dưới chạy chính `VoxDub.exe` giải nén từ zip phát hành, trong
      # hộp cát nằm NGOÀI cây mã nguồn, và soi lại tệp video ra bằng đúng bộ
      # đo của cổng cũ. Hỏng = không phát hành.
      - name: I0-D + I0-F — cài mới sạch rồi dub bằng chính VoxDub.exe
        run: >
          python scripts/kiem_goi_phat_hanh.py --che-do sach
          --zip "VoxDub-Studio-${{ github.ref_name }}-win64.zip"
          --goc-thu "${{ runner.temp }}/hop-goi"
          --bang-chung packaged-dub-evidence
          --sha "${{ github.sha }}" --timeout 2700

      - name: I0-E + I0-F — nâng cấp cạnh bản cũ rồi dub bằng chính VoxDub.exe
        run: >
          python scripts/kiem_goi_phat_hanh.py --che-do nang-cap
          --zip "VoxDub-Studio-${{ github.ref_name }}-win64.zip"
          --goc-thu "${{ runner.temp }}/hop-goi"
          --bang-chung packaged-dub-evidence
          --sha "${{ github.sha }}" --timeout 2700

      - name: I0-E ca âm — khác thư mục cha · thiếu thành phần · cấu hình hỏng
        run: >
          python scripts/kiem_goi_phat_hanh.py --che-do am-tinh
          --zip "VoxDub-Studio-${{ github.ref_name }}-win64.zip"
          --goc-thu "${{ runner.temp }}/hop-goi"
          --bang-chung packaged-dub-evidence
          --sha "${{ github.sha }}" --timeout 2700

      # Bằng chứng phải còn lại SAU khi job kết thúc, kể cả (nhất là) khi đỏ —
      # không có nó thì mỗi lần hỏng lại phải dựng lại từ đầu để đoán.
      - name: Giữ lại bằng chứng cổng kiểm bản đóng gói
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-dub-evidence-${{ github.run_id }}
          path: packaged-dub-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Bảng kết quả các cổng (đọc từ tệp bằng chứng, không gõ tay)
        if: always()
        shell: bash
        run: |
          python scripts/kiem_goi_phat_hanh.py --chi-in-bang \
            --bang-chung packaged-dub-evidence \
            --trang-thai-nguon "${{ steps.dub-nguon.outcome }}" \
            >> "$GITHUB_STEP_SUMMARY"

      # I0 — tách dry-run (workflow_dispatch, để kiểm .exe thật) khỏi publish
      # thật (chỉ khi trigger là push tag `v*`). Trước bản vá này, cả hai
      # đường trigger đều chạy thẳng tới publish — dispatch tay để thử build
      # sẽ vô tình tạo GitHub Release công khai, và app có update checker đọc
      # đúng nguồn đó nên người dùng thật có thể bị mời cập nhật một bản chưa
      # được duyệt.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VoxDub-Studio-*-win64.zip
          generate_release_notes: true

      - name: Dry-run (workflow_dispatch) — không publish
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          echo "Trigger không phải tag v* (${{ github.ref }}) — bỏ qua Publish GitHub Release."
          echo "Artifact vẫn còn trong dist/ và VoxDub-Studio-*-win64.zip cho lượt chạy này, xem Actions summary/log để kiểm."
