name: Test (Python + Node)

# Mini-spec V38 (docs/PLAN.md) — cổng kiểm tra tự động, TÁCH RIÊNG khỏi
# release.yml (build .exe thật trên Windows). Chạy trên MỌI push và mọi PR
# vào main, không chỉ lúc chuẩn bị phát hành — kiểm tra sớm, kiểm tra
# thường xuyên. Không tự bật branch protection (gate cứng) — đó là quyết
# định của chủ dự án, workflow này chỉ báo pass/fail rõ ràng.

on:
  push: {}
  pull_request:
    branches: [main]

jobs:
  python-tests:
    # ubuntu-latest, không phải windows-latest (release.yml) — phần lớn
    # test không phụ thuộc Windows-specific, phút Actions Linux rẻ/nhanh
    # hơn nhiều so với Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6/Qt cần vài thư viện hệ thống ngay cả ở chế độ offscreen —
      # ubuntu-latest trần trụi thiếu (lộ ra lúc chạy thật lần đầu, xem
      # docs/PLAN.md V38 Verify — libEGL.so.1 not found).
      - name: Cài thư viện hệ thống cho Qt offscreen + ffmpeg (vài test gọi thật)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 ffmpeg fonts-wqy-zenhei

      # C56 — bộ quét chữ (OCR) chạy trong `.venv-ocr` riêng, KHÔNG bao giờ
      # nằm trong venv chính. Trước C56, `tests/test_text_regions.py` mở đầu
      # bằng `importorskip("rapidocr_onnxruntime")` nên **cả tệp chưa từng chạy
      # trên CI** — tính năng che chữ (V5, C48–C51) không có test nào canh, mà
      # bảng kết quả chỉ hiện màu xám "skipped". Cài venv này để CI chạy đúng
      # đường mà bản `.exe` dùng. ~40 MB, vài giây.
      - name: Cài bộ quét chữ (.venv-ocr + venv chính) cho test OCR
        run: |
          python scripts/setup_ocr.py
          # Thêm vào venv chính để test SO SÁNH hai đường chạy được: nó cần cả
          # đường subprocess (.venv-ocr) lẫn đường in-process cùng lúc.
          pip install rapidocr-onnxruntime

      # Loại demucs/soundfile — nặng (kéo theo torch), không cần cho test
      # suite hiện có (xem docs/PLAN.md V38 Audit Before Build: đã xác
      # nhận .venv-test không có 2 gói này mà vẫn 1096+/1102 pass).
      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          grep -viE '^demucs|^soundfile' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt

      - name: Chạy pytest (headless, không màn hình)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: control_server/package-lock.json

      - name: Cài dependencies
        working-directory: control_server
        run: npm ci

      - name: Chạy test
        working-directory: control_server
        run: npm test

  # Bộ test giao diện web — 76 test Vitest + React Testing Library.
  #
  # Vì sao thêm (24/09/2026): rà `.github/workflows/` ra **0 lần** nhắc tới
  # `website/`. Bộ này tồn tại từ lâu, có `npm test` hẳn hoi, và CHƯA BAO GIỜ
  # chạy trong CI — nó chỉ xanh khi có người nhớ chạy tay. Hai test thêm ngày
  # 23/09 cho lỗi nhãn «Thử ngay» lọt vào `main` mà không cổng nào soi.
  #
  # Một bộ test không ai chạy thì không phải cổng, nó là tài liệu.
  website-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, KHÁC `node-tests` (20). Không phải tuỳ tiện: lượt chạy đầu
      # tiên của job này trên Node 20 đỏ ngay với
      # `webidl.util.markAsUncloneable is not a function` — `jsdom` gọi hàm
      # chỉ có ở Node mới. Bộ test website VẪN LUÔN cần Node mới; không ai
      # biết vì chưa từng có môi trường nào khác máy dev thử nó.
      #
      # `control_server` giữ 20 vì đó là bản Node của dịch vụ CHẠY THẬT. Đây
      # chỉ là công cụ dựng, nên lệch phiên bản ở đây không nói gì về prod.
      # Yêu cầu nay ghi ở `website/package.json` (`engines`) chứ không chỉ
      # nằm trong tệp CI.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Cài dependencies
        working-directory: website
        run: npm ci

      - name: Chạy test
        working-directory: website
        run: npm test

  # Mini-spec V90 — chốt chặn cho bẫy đã sập HAI lần: `voxdub-app` và
  # `voxdub-dub-worker` deploy từ nhánh sinh tự động, không phải `main`.
  # Quên chạy script sinh nhánh thì VAYS build lại mã cũ mà mọi chặng vẫn
  # xanh. Tài liệu đã cảnh báo từ 18-08 và vẫn sập lần hai — nên việc nhắc
  # chuyển từ người sang máy.
  #
  # Job này KHÔNG chặn merge (không bật branch protection) — nó chỉ làm cho
  # tình trạng "nhánh deploy tụt lại" trở nên NHÌN THẤY ĐƯỢC ngay trên mỗi
  # mini-spec C45 — lượt chạy THẬT trên Windows, sớm chứ không đợi tới lúc phát
  # hành. `release.yml` đã có cổng chặn cùng kịch bản này, nhưng phát hiện lỗi
  # lúc bấm phát hành là muộn: bản build hỏng, tag đã đẩy, phải dọn. Chạy ở đây
  # thì biết ngay ở commit gây ra nó.
  #
  # Vì sao phải là Windows chứ không phải ubuntu: toàn bộ người dùng dùng
  # Windows, và ba lỗi thật gần đây chỉ lộ ra ở đó — bảng mã cp1258 giết worker
  # in tiếng Việt (D1f), thiếu DLL torchcodec (C43), và faster-whisper ném
  # ValueError với ngôn ngữ rỗng (C44).
  chay-that-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bảo đảm có ffmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1

      - name: Một lượt dub thật, dừng ở bước dịch
        env:
          WHISPER_MODEL: tiny
        run: python scripts/kiem_chay_that.py --video mau_kiem_chay.mp4 --timeout 1800

  # C57 — SINH LẠI NHÁNH DEPLOY TỰ ĐỘNG.
  #
  # Bước "sinh lại nhánh deploy" luôn nằm SAU lần push `main`, nên dù C54 đã
  # cho job kiểm chạy trên nhánh deploy, lượt chạy của chính `main` vẫn đỏ tới
  # khi có người nhớ ra và chạy script. Cửa sổ đỏ ngắn hơn, nhưng vẫn còn — và
  # nó vẫn dựa vào trí nhớ con người, đúng thứ V90 đã kết luận là không sửa
  # được bằng tài liệu.
  #
  # Nay máy tự làm: mỗi lần `main` đổi, CI sinh lại cả hai nhánh và force-push.
  # Nhánh deploy không còn có thể tụt lại, nên không còn gì để quên. Push bằng
  # GITHUB_TOKEN cố ý KHÔNG kích hoạt workflow mới (quy tắc của GitHub) — đó
  # cũng là thứ chặn vòng lặp vô tận.
  # D3 (14/09/2026) — CỔNG: nhánh deploy chỉ được sinh SAU khi test xanh.
  #
  # Trước D3, job này KHÔNG có `needs:` nên nó force-push ở giây thứ 11, còn
  # cổng test cuối cùng mãi phút thứ 4 mới xanh (đo thật trên lượt 84ac00d:
  # force-push 03:16:46, python-tests xong 03:20:45 — hở 3 phút 59 giây).
  #
  # `trien-khai-prod` thì vẫn chặn đúng (đã chứng minh: lượt 34584418242 ngày
  # 11/09 python-tests ĐỎ ⇒ bị bỏ qua). Nhưng nhánh deploy là **nguồn sự thật
  # của production**, và nó đã mang mã trượt test rồi NẰM LẠI ĐÓ tới lần push
  # xanh kế tiếp. `main` có 58 lượt đỏ trong lịch sử — mỗi lượt là một quãng
  # mà bất cứ ai bấm redeploy trên giao diện Vibe Host, chạy `mb-deploy`, hay
  # gọi `redeploy_project` qua MCP đều đưa mã đỏ lên prod, không tín hiệu nào.
  #
  # Nay hỏng test thì nhánh deploy ĐỨNG NGUYÊN ở bản xanh gần nhất. Giá phải
  # trả: nhánh deploy chậm hơn `main` khoảng 4 phút. Đó đúng là cái giá của
  # việc không để mã chưa kiểm nằm ở nguồn sự thật của prod.
  sinh-nhanh-deploy:
    if: github.ref == 'refs/heads/main'
    needs: [python-tests, node-tests, chay-that-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Danh tính git cho commit sinh tự động
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sinh lại hai nhánh deploy từ đúng commit vừa push
        id: sinh
        env:
          REMOTE: origin
          GOC: ${{ github.sha }}
        run: |
          # Ghi lại đầu nhánh TRƯỚC khi sinh, để biết THƯ MỤC BUILD có đổi
          # không. Nhánh deploy đổi commit theo MỌI commit của main (nó là
          # worktree của cả repo), nhưng thứ nền tảng dựng chỉ là một thư mục
          # con — một commit sửa tài liệu không đáng 11 phút dựng lại worker.
          truoc_app=$(git rev-parse origin/deploy/vays-control-server 2>/dev/null || echo "")
          truoc_worker=$(git rev-parse origin/deploy/vays-dub-worker 2>/dev/null || echo "")

          bash scripts/gen_vays_control_server_branch.sh
          bash scripts/gen_vays_dub_worker_branch.sh

          sau_app=$(git rev-parse deploy/vays-control-server)
          sau_worker=$(git rev-parse deploy/vays-dub-worker)
          echo "sha_app=$sau_app" >> "$GITHUB_OUTPUT"
          echo "sha_worker=$sau_worker" >> "$GITHUB_OUTPUT"

          # Chưa có nhánh cũ để so (lần đầu) thì coi như CÓ đổi — thà dựng thừa
          # một lượt còn hơn để prod đứng im mà tưởng đã lên.
          # D3 (sửa 14/09, sau khi tự gây ra): LOẠI `SOURCE_SHA` khỏi phép so.
          # Tệp đó mang SHA nguồn nên nó đổi ở MỌI commit, kể cả commit chỉ sửa
          # tài liệu — mà nó lại nằm trong thư mục build. Hậu quả đo được ngay
          # trong ngày: `voxdub-app` nhảy v89→v92 và worker v51→v54 chỉ vì mấy
          # commit tài liệu, tức chính sách "chỉ deploy dịch vụ có thư mục build
          # thay đổi" bị vô hiệu, và worker thì tốn ~11 phút dựng lại mỗi lượt.
          #
          # Bỏ qua nó ở đây KHÔNG làm mất truy vết: prod giữ ảnh cũ thì `/health`
          # khai đúng SHA đã dựng ra ảnh đó. Khai SHA `main` mới nhất trong khi
          # không dựng lại mới là nói dối.
          if [ -z "$truoc_app" ] || ! git diff --quiet "$truoc_app" "$sau_app" \
              -- webapp/ ':(exclude)webapp/control_server/SOURCE_SHA'; then
            echo "app=1" >> "$GITHUB_OUTPUT"
            echo "→ thư mục webapp/ có đổi: cần deploy voxdub-app"
          else
            echo "app=0" >> "$GITHUB_OUTPUT"
            echo "→ webapp/ không đổi: bỏ qua deploy voxdub-app"
          fi
          if [ -z "$truoc_worker" ] || ! git diff --quiet "$truoc_worker" "$sau_worker" \
              -- dub-worker/ ':(exclude)dub-worker/SOURCE_SHA'; then
            echo "worker=1" >> "$GITHUB_OUTPUT"
            echo "→ thư mục dub-worker/ có đổi: cần deploy voxdub-dub-worker"
          else
            echo "worker=0" >> "$GITHUB_OUTPUT"
            echo "→ dub-worker/ không đổi: bỏ qua deploy worker"
          fi
    outputs:
      app: ${{ steps.sinh.outputs.app }}
      worker: ${{ steps.sinh.outputs.worker }}
      # D3 — SHA của chính hai nhánh vừa sinh. `trien-khai-prod` đối chiếu
      # đầu nhánh TRÊN REMOTE với hai giá trị này ngay trước khi gọi deploy:
      # `redeploy_project` không nhận tham số SHA, nó dựng "đầu nhánh lúc
      # này". Một lượt push khác rơi vào quãng đó sẽ sinh lại nhánh, và lượt
      # chạy của SHA cũ sẽ deploy mã của SHA mới rồi báo thành công cho SHA cũ.
      sha_app: ${{ steps.sinh.outputs.sha_app }}
      sha_worker: ${{ steps.sinh.outputs.sha_worker }}

  # C58 — ĐƯA PROD THEO `main` TỰ ĐỘNG.
  #
  # Tới C57 nhánh deploy không thể tụt lại nữa, nhưng bấm redeploy vẫn là việc
  # tay: prod đi sau `main` một quãng không ai đo được, và quãng đó chỉ lộ ra
  # khi có người tình cờ đi kiểm (đã để worker chạy mã trước C53 nhiều ngày).
  #
  # Ba chốt để tự động KHÔNG biến thành liều:
  #   1. Chỉ chạy sau khi test Python + Node + LƯỢT DUB THẬT trên Windows xanh.
  #      Prod không bao giờ nhận mã chưa ai kiểm.
  #   2. Chỉ deploy dịch vụ có thư mục build thật sự đổi.
  #   3. Sau khi deploy, hỏi chính dịch vụ (`/health`). Tác vụ báo thành công
  #      mà dịch vụ câm thì đây vẫn là lượt deploy HỎNG — xem
  #      scripts/trien_khai_vibehost.py.
  #
  # Thiếu secret VIBEHOST_TOKEN thì bỏ qua và NÓI TO, không làm đỏ CI: repo
  # phải dùng được với người không có khoá deploy.
  trien-khai-prod:
    if: github.ref == 'refs/heads/main'
    needs: [sinh-nhanh-deploy, python-tests, node-tests, chay-that-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Có khoá deploy không
        id: khoa
        env:
          CO_KHOA: ${{ secrets.VIBEHOST_TOKEN != '' }}
        run: |
          echo "co=$CO_KHOA" >> "$GITHUB_OUTPUT"
          if [ "$CO_KHOA" != "true" ]; then
            echo "::warning::Chưa cấu hình secret VIBEHOST_TOKEN — BỎ QUA bước đưa lên prod. Prod sẽ đứng lại ở bản deploy tay gần nhất."
          fi

      # D3 — `--sha-nhanh` và `--sha-nguon` là hai chốt khác nhau, cần cả hai:
      #
      #   `--sha-nhanh`  đối chiếu đầu nhánh deploy TRÊN REMOTE ngay trước khi
      #                  gọi deploy. `redeploy_project` không nhận SHA — nó
      #                  dựng "đầu nhánh lúc này". Một lượt push khác chen vào
      #                  giữa sẽ sinh lại nhánh, và lượt chạy này sẽ deploy mã
      #                  của SHA khác rồi báo thành công cho SHA của mình.
      #   `--sha-nguon`  đối chiếu SHA mà DỊCH VỤ ĐANG CHẠY tự khai ở `/health`.
      #                  Chốt trên nói "tôi gửi đúng thứ"; chốt này nói "thứ
      #                  đang chạy đúng là nó". Chỉ chốt đầu thì vẫn là suy luận.
      - name: Đưa voxdub-app lên prod
        if: steps.khoa.outputs.co == 'true' && needs.sinh-nhanh-deploy.outputs.app == '1'
        env:
          VIBEHOST_TOKEN: ${{ secrets.VIBEHOST_TOKEN }}
        run: |
          python3 scripts/trien_khai_vibehost.py \
            --du-an cmsx1rb7d016w0i5fo0cj2r8c --ten voxdub-app \
            --suc-khoe https://voxdub-app.cmc-1.vibenode.matbao.ai/health \
            --nhanh-deploy deploy/vays-control-server \
            --sha-nhanh ${{ needs.sinh-nhanh-deploy.outputs.sha_app }} \
            --sha-nguon ${{ github.sha }}

      - name: Đưa voxdub-dub-worker lên prod
        if: steps.khoa.outputs.co == 'true' && needs.sinh-nhanh-deploy.outputs.worker == '1'
        env:
          VIBEHOST_TOKEN: ${{ secrets.VIBEHOST_TOKEN }}
        run: |
          # D5 (15/09) — worker NAY tự khai SHA ở `/health` (JSON, trường
          # `commit`, đọc `dub-worker/SOURCE_SHA` y như control_server làm),
          # nên `--sha-nguon` áp dụng được cho nó. Trước đó đường này trả
          # chuỗi "ok" thuần và chốt phải bỏ trống — hậu quả: worker từng chạy
          # mã cũ nhiều ngày mà không cách nào phát hiện từ xa.
          python3 scripts/trien_khai_vibehost.py \
            --du-an cmsxh07sy039q0i5fpxpal7mv --ten voxdub-dub-worker \
            --suc-khoe https://voxdub-dub-worker.cmc-1.vibenode.matbao.ai/health \
            --nhanh-deploy deploy/vays-dub-worker \
            --sha-nhanh ${{ needs.sinh-nhanh-deploy.outputs.sha_worker }} \
            --sha-nguon ${{ github.sha }}

  # lần push, thay vì chỉ lộ ra lúc deploy xong mà không ai hay.
  # C54: chạy CẢ khi push nhánh deploy/*, không chỉ main. Quy trình đúng là
  # "push main → sinh lại nhánh deploy → redeploy", nên lượt chạy của main
  # LUÔN đỏ (lúc nó chấm thì nhánh deploy còn chưa sinh) và chỉ xanh lại ở lần
  # push main kế tiếp — tức main đứng đỏ suốt, đúng cách để một bộ canh bị coi
  # là nền. Nay bước sinh lại nhánh cũng tự chấm điểm cho mình.
  deploy-branch-drift:
    if: |
      always() && (github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/heads/deploy/'))
    # Chạy SAU khi sinh lại (C57) — chấm trước thì luôn chấm phải trạng thái
    # chưa sinh. Trên nhánh deploy/* job kia không chạy, `always()` giữ cho
    # job này vẫn chạy thay vì bị bỏ qua theo.
    needs: [sinh-nhanh-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần lịch sử đầy đủ + các nhánh deploy để so cây thư mục.
          fetch-depth: 0

      - name: Nạp các nhánh deploy
        run: |
          git fetch origin 'refs/heads/deploy/*:refs/remotes/github/deploy/*' || true
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nhánh deploy có khớp main không
        env:
          # D3 — kết quả của job sinh nhánh. Từ D3, job đó bị GATE sau test,
          # nên khi test đỏ nó bị BỎ QUA và nhánh deploy cố ý đứng lại ở bản
          # xanh gần nhất. Lúc đó "lệch" là ĐÚNG và MONG MUỐN — báo đỏ ở đây
          # sẽ biến một chốt an toàn thành một bộ canh kêu nhầm, mà chính
          # backlog dự án đã ghi: bộ canh hay kêu nhầm thì người ta tắt nó đi,
          # còn tệ hơn không có.
          KET_QUA_SINH: ${{ needs.sinh-nhanh-deploy.result }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$KET_QUA_SINH" != "success" ]; then
            echo "::notice::Job sinh nhánh deploy không chạy/không xong ($KET_QUA_SINH)."
            echo "::notice::Nhánh deploy CỐ Ý giữ nguyên bản xanh gần nhất — đây là cổng D3 đang làm đúng việc, KHÔNG phải lệch cần sửa."
            echo "Đầu nhánh deploy hiện tại (bản xanh gần nhất):"
            git ls-remote origin 'refs/heads/deploy/*' || true
            exit 0
          fi
          # Trên main: chấm đúng commit đang chạy (HEAD), không phải origin/main
          # có thể đã đi tiếp. Trên nhánh deploy: chấm so với main mới nhất.
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then GOC=HEAD; else GOC=origin/main; fi
          python3 scripts/kiem_nhanh_deploy.py --goc "$GOC"

  # ==================================================================
  # D5 — PROD CÓ ĐANG CHẠY ĐÚNG MÃ CỦA `main` KHÔNG?
  #
  # Câu hỏi này KHÔNG chốt nào của D3 trả lời được, vì cả `--sha-nhanh` lẫn
  # `--sha-nguon` nằm BÊN TRONG lượt deploy: deploy không chạy thì chốt cũng
  # không chạy. Chuyện thật 14/09: `df980b2` deploy hỏng vì cổng Vibe Host
  # 404; commit kế tiếp chỉ sửa tài liệu nên bước "có cần deploy không" so bản
  # dựng MỚI với bản dựng TRƯỚC, thấy giống nhau, kết luận `app=0` và bỏ qua
  # deploy. Prod chạy mã cũ 21 GIỜ với CI xanh toàn bộ.
  #
  # `needs: trien-khai-prod` + `always()`: phải chạy SAU lượt deploy (chạy
  # trước thì mọi commit mã đều đỏ oan vì prod chưa kịp lên), và phải chạy CẢ
  # KHI lượt deploy hỏng hoặc bị bỏ qua — đó chính là hai ca đang im lặng.
  kiem-prod-theo-main:
    if: always() && github.ref == 'refs/heads/main'
    needs: [trien-khai-prod, python-tests, node-tests, chay-that-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cần lịch sử đầy đủ: chốt này nở SHA prod tự khai rồi `git diff`
          # ngược về đó. Clone nông (mặc định) thì không có commit ấy và chốt
          # sẽ phải trả lời "không kết luận được" ở MỌI lượt.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prod có chạy đúng mã của main không
        env:
          # Test đỏ ⇒ `sinh-nhanh-deploy` bị bỏ qua ⇒ prod CỐ Ý đứng lại ở bản
          # xanh gần nhất. Lúc đó "prod tụt lại" là ĐÚNG và MONG MUỐN, và báo
          # đỏ ở đây sẽ biến một chốt an toàn thành bộ canh kêu nhầm — đúng
          # cái bẫy mà `deploy-branch-drift` đã phải tránh, và backlog dự án
          # đã ghi: bộ canh hay kêu nhầm thì người ta tắt nó đi, còn tệ hơn
          # không có.
          PY: ${{ needs.python-tests.result }}
          ND: ${{ needs.node-tests.result }}
          WIN: ${{ needs.chay-that-windows.result }}
        run: |
          if [ "$PY" != "success" ] || [ "$ND" != "success" ] || [ "$WIN" != "success" ]; then
            echo "::notice::Test chưa xanh (python=$PY node=$ND windows=$WIN) — prod CỐ Ý giữ bản xanh gần nhất."
            echo "::notice::D5 bỏ qua lượt này: 'prod tụt lại' lúc này là cổng D3 đang làm đúng việc, không phải lệch cần sửa."
            exit 0
          fi
          python3 scripts/kiem_prod_theo_main.py \
            --sha-main ${{ github.sha }} \
            --app https://voxdub-app.cmc-1.vibenode.matbao.ai/health \
            --worker https://voxdub-dub-worker.cmc-1.vibenode.matbao.ai/health
